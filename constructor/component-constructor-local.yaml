# Local-only OCM component descriptor — used for local kind-registry dev.
#
# Charts must be pre-pushed to kind-registry as standard Helm OCI artifacts
# (via `helm push`) before running `ocm add components` with this file.
# This ensures Flux can find the layer with the correct Helm media type.
#
# Build this from inside the cluster (e.g. transfer pod) so kind-registry:5000
# is reachable for OCM to resolve the artifact references.
#
# No image resources — images are loaded into kind separately via `make kind-load-all`.
#
# Template variables (go templater):
#   VERSION        — component version (e.g. 0.0.0-dev)
#   CHART_VERSION  — chart version / OCI tag (e.g. 0.0.0-dev)
components:
  - name: github.com/platform-mesh/kbind-provider
    version: {{ .VERSION }}
    provider:
      name: platform-mesh
    resources:
      - name: operator-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        access:
          type: ociArtifact
          imageReference: http://kind-registry:5000/helm-charts/kbind-provider-operator:{{ .CHART_VERSION }}
      - name: portal-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        access:
          type: ociArtifact
          imageReference: http://kind-registry:5000/helm-charts/kbind-provider-portal:{{ .CHART_VERSION }}
