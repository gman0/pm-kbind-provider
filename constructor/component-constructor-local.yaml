# Local-only OCM component descriptor — used by hack/push-local.sh.
#
# hack/push-local.sh copies prerelease chart directories and this file into
# $BUILD_DIR, then runs `ocm add components` from $BUILD_DIR. Paths below are
# therefore relative to $BUILD_DIR (i.e. siblings of this file at runtime).
#
# No image resources — images are loaded into kind separately via `make kind-load-all`.
#
# Template variables (go templater):
#   VERSION        — component version (e.g. 0.0.0-dev)
#   CHART_VERSION  — chart version embedded in the OCI artifact tag
components:
  - name: github.com/platform-mesh/kbind-provider
    version: {{ .VERSION }}
    provider:
      name: platform-mesh
    resources:
      - name: operator-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        input:
          type: helm
          path: ./kbind-provider-operator
          version: {{ .CHART_VERSION }}
      - name: portal-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        input:
          type: helm
          path: ./kbind-provider-portal
          version: {{ .CHART_VERSION }}
