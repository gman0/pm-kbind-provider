# OCM component descriptor for the PlatformMesh kube-bind provider.
#
# Templated by `make ocm-build` (go templater). This is a SELF-CONTAINED component: it
# bundles both this repo's operator and portal artifacts. The kcp bootstrap manifests are
# not shipped separately — the init image already embeds them via go:embed.
#
# Every chart and image is referenced as an OCI artifact (charts are packaged and pushed
# by `make helm-push` first). `make ocm-push` then transfers with --copy-resources,
# relocating all referenced artifacts into $(OCM_REPO) — so the whole provider resolves
# from our own registry (ghcr.io/platform-mesh). The ManagedProvider
# (config/platfrom-mesh-ocm) then pulls every runtime deployment from this one component.
#
# OCI_TAG is the single source of truth for the deployed images: `make helm-push` stamps
# both charts' image.tag to OCI_TAG, and the ociImage resources below reference the same
# tag — so the image resources and the images the charts actually deploy stay in lockstep.
components:
  - name: github.com/platform-mesh/kube-bind-provider
    version: {{ .VERSION }}
    provider:
      name: platform-mesh
    resources:
      # ---- Helm charts -----------------------------------------------------
      # Operator chart — ships the kbind-provider-operator and its CRDs.
      - name: operator-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        relation: local
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/kube-bind-provider/charts/kbind-provider-operator:{{ .CHART_VERSION }}
      # Portal chart — ships the Angular UI (kbind-provider-portal).
      - name: portal-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        relation: local
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/kube-bind-provider/charts/kbind-provider-portal:{{ .CHART_VERSION }}

      # ---- Container images ------------------------------------------------
      - name: operator-image
        type: ociImage
        relation: local
        version: {{ .IMAGE_VERSION }}
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/kbind-provider-operator:{{ .OCI_TAG }}
      - name: init-image
        type: ociImage
        relation: local
        version: {{ .IMAGE_VERSION }}
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/kube-bind-provider-init:{{ .OCI_TAG }}
      - name: portal-image
        type: ociImage
        relation: local
        version: {{ .IMAGE_VERSION }}
        access:
          type: ociArtifact
          imageReference: ghcr.io/platform-mesh/kbind-provider-portal:{{ .OCI_TAG }}
