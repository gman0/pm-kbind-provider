apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  labels:
    ui.platform-mesh.io/content-for: kbind.platform-mesh.io
  name: kbind.platform-mesh.io
spec:
  permissionClaims:
    - group: ""
      resource: namespaces
      # verbs: ["create", "get"]
      verbs: ["*"]
    - group: ""
      resource: serviceaccounts
      # verbs: ["create", "get", "delete"]
      verbs: ["*"]
    - group: ""
      resource: secrets
      # verbs: ["create", "get", "delete"]
      verbs: ["*"]
    - group: "rbac.authorization.k8s.io"
      resource: clusterrolebindings
      # verbs: ["create", "get", "delete"]
      verbs: ["*"]
